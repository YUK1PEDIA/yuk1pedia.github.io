{{ define "main" }}
<main class="site-main section-inner thin">
  <header class="page-header"><p class="eyebrow">Tag</p><h1>{{ .Title }}</h1></header>
  <ol class="taxonomy-posts">
    {{- range .Pages.ByDate.Reverse }}
    <li><a class="post-row" href="{{ .RelPermalink }}"><span>{{ .Title }}</span><time>{{ .Date.Format "2006-01-02" }}</time></a></li>
    {{- end }}
  </ol>
  {{ partial "footer.html" . }}
</main>
{{ end }}
