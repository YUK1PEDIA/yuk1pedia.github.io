baseURL: "https://yuk1pedia.github.io/"
locale: "zh-cn"
defaultContentLanguage: "zh"
title: "YUKIPEDIA"
timeZone: "Asia/Shanghai"
hasCJKLanguage: true
enableRobotsTXT: true
enableGitInfo: false

permalinks:
  posts: "/posts/:year/:month/:day/:slug/"

pagination:
  pagerSize: 20

taxonomies:
  tag: tags

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: true
    style: "monokai"

minify:
  minifyOutput: true

params:
  description: "思考、技术与生活的长期记录"
  tagline: "welcome to my blog ( ˶'ᵕ'˶)"
  author: "YUK1PEDIA"
  github: "https://github.com/YUK1PEDIA"
  footer: "All rights reserved."

menu:
  main:
    - name: "Posts"
      pageRef: "/posts"
      weight: 10
    - name: "Tags"
      pageRef: "/tags"
      weight: 20
    - name: "About"
      pageRef: "/about"
      weight: 30
